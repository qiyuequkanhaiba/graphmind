name: Secret Scanning

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly re-scan: a gitleaks rule update can surface a secret that was
    # already merged, so a green push does not stay green forever.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Bump this and the checksum check below together. The archive is verified
  # against the release checksums file before it is executed.
  GITLEAKS_VERSION: "8.30.1"

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Full history on purpose: a committed secret is leaked even when a
          # later commit removes it, so scanning only the tip is not enough.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          install_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location \
            --output "$install_dir/$archive" "$base/$archive"
          curl --fail --silent --show-error --location \
            --output "$install_dir/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          cd "$install_dir"
          grep " $archive\$" checksums.txt | sha256sum --check --strict
          tar --extract --gzip --file "$archive"
          ./gitleaks version

      - name: Scan full git history
        run: |
          set -o pipefail
          "$RUNNER_TEMP/gitleaks/gitleaks" git "$GITHUB_WORKSPACE" \
            --log-opts=--all \
            --redact \
            --verbose \
            --no-banner \
            --report-format json \
            --report-path "$RUNNER_TEMP/gitleaks/gitleaks-report.json" \
            --exit-code 1

      - name: Upload secret scan report
        if: always()
        # v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secret-scan-report
          path: ${{ runner.temp }}/gitleaks/gitleaks-report.json
          if-no-files-found: ignore
