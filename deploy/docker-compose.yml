services:
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    env_file:
      - ${GRAPHMIND_SERVICE_ENV_FILE:-.env.production}
    environment:
      GRAPHMIND_WORKSPACE_ROOT: /var/lib/graphmind/workspace
      GRAPHMIND_IMPORT_WORKER_MODE: external
    volumes:
      - graphmind-workspace:/var/lib/graphmind
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; host=(os.environ.get('GRAPHMIND_TRUSTED_HOSTS') or '127.0.0.1').split(',')[0].strip(); req=urllib.request.Request('http://127.0.0.1:8000/api/ready', headers={'Host': host}); urllib.request.urlopen(req, timeout=5).read()\""
        ]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    env_file:
      - ${GRAPHMIND_SERVICE_ENV_FILE:-.env.production}
    environment:
      GRAPHMIND_WORKSPACE_ROOT: /var/lib/graphmind/workspace
      GRAPHMIND_IMPORT_WORKER_MODE: external
    volumes:
      - graphmind-workspace:/var/lib/graphmind
    command:
      - /bin/sh
      - -ec
      - |
        until python -c "import os, urllib.request; host=(os.environ.get('GRAPHMIND_TRUSTED_HOSTS') or '127.0.0.1').split(',')[0].strip(); req=urllib.request.Request('http://backend:8000/api/health', headers={'Host': host}); urllib.request.urlopen(req, timeout=5).read()"
        do
          sleep 1
        done
        exec python -m graphmind.workers.import_worker --interval-seconds 5
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /var/lib/graphmind/workspace/state/import-worker-heartbeat && find /var/lib/graphmind/workspace/state/import-worker-heartbeat -mmin -1 | grep -q ."
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    depends_on:
      backend:
        condition: service_healthy
      worker:
        condition: service_healthy
    ports:
      - "${GRAPHMIND_HTTP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  ops:
    profiles: ["ops"]
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    env_file:
      - ${GRAPHMIND_SERVICE_ENV_FILE:-.env.production}
    environment:
      GRAPHMIND_WORKSPACE_ROOT: /var/lib/graphmind/workspace
      GRAPHMIND_IMPORT_WORKER_MODE: external
    entrypoint: ["python", "/app/backend/graphmind-ops.py"]
    volumes:
      - graphmind-workspace:/var/lib/graphmind
      - ./graphmind-ops.py:/app/backend/graphmind-ops.py:ro
      - ${GRAPHMIND_BACKUP_DIR:-/var/backups/graphmind}:/backups

volumes:
  graphmind-workspace:
